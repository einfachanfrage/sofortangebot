name: Database migrations

on:
  push:
    branches: [develop]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/database-migrations.yml'
  workflow_dispatch:
    inputs:
      target:
        description: Zielumgebung
        required: true
        type: choice
        options:
          - staging
          - production
      operation:
        description: Nur prüfen oder Migrationen anwenden
        required: true
        default: audit
        type: choice
        options:
          - audit
          - apply
      confirm_production:
        description: Für Produktion exakt DEPLOY-PRODUCTION eingeben
        required: false
        type: string

permissions:
  contents: read

jobs:
  staging:
    if: github.event_name == 'push' || inputs.target == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      TARGET_DB_URL: ${{ secrets.STAGING_DB_URL }}

    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Staging-Migrationsstand prüfen
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TARGET_DB_URL" || { echo "::error::STAGING_DB_URL fehlt"; exit 1; }
          supabase migration list --db-url "$TARGET_DB_URL" > migration-status-staging-before.txt
      - name: Staging-Migrationen anwenden
        if: github.event_name == 'push' || inputs.operation == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(psql "$TARGET_DB_URL" -Atc "select to_regclass('public.companies')")" ]; then
            echo "Leeres Stagingprojekt erkannt: historisches Basisschema wird initialisiert."
            psql "$TARGET_DB_URL" -v ON_ERROR_STOP=1 -f supabase/schema.sql
          fi
          supabase db push --yes --db-url "$TARGET_DB_URL"
          supabase migration list --db-url "$TARGET_DB_URL" > migration-status-staging-after.txt
      - uses: actions/upload-artifact@v4
        with:
          name: migration-status-staging-${{ github.run_id }}
          path: migration-status-staging-*.txt
          retention-days: 90

  production:
    if: inputs.target == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      TARGET_DB_URL: ${{ secrets.PRODUCTION_DB_URL }}

    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Produktions-Migrationsstand prüfen
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TARGET_DB_URL" || { echo "::error::PRODUCTION_DB_URL fehlt"; exit 1; }
          supabase migration list --db-url "$TARGET_DB_URL" > migration-status-production-before.txt
      - name: Produktionsfreigabe prüfen
        if: inputs.operation == 'apply'
        shell: bash
        env:
          CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
        run: |
          set -euo pipefail
          test "$CONFIRM_PRODUCTION" = "DEPLOY-PRODUCTION" || {
            echo "::error::Für das Anwenden auf Produktion fehlt DEPLOY-PRODUCTION"
            exit 1
          }
      - name: Produktions-Migrationen anwenden
        if: inputs.operation == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --yes --db-url "$TARGET_DB_URL"
          supabase migration list --db-url "$TARGET_DB_URL" > migration-status-production-after.txt
      - uses: actions/upload-artifact@v4
        with:
          name: migration-status-production-${{ github.run_id }}
          path: migration-status-production-*.txt
          retention-days: 365
