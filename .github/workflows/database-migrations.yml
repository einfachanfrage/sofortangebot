name: Database migrations

on:
  push:
    branches: [develop]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/database-migrations.yml'
  workflow_dispatch:
    inputs:
      target:
        description: Zielumgebung
        required: true
        type: choice
        options:
          - staging
          - production
      operation:
        description: Nur prüfen oder Migrationen anwenden
        required: true
        default: audit
        type: choice
        options:
          - audit
          - apply
      confirm_production:
        description: Für Produktion exakt DEPLOY-PRODUCTION eingeben
        required: false
        type: string

permissions:
  contents: read

jobs:
  staging:
    if: github.event_name == 'push' || inputs.target == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      TARGET_DB_URL: ${{ secrets.STAGING_DB_URL }}

    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Staging-Migrationsstand prüfen
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TARGET_DB_URL" || { echo "::error::STAGING_DB_URL fehlt"; exit 1; }
          supabase migration list --db-url "$TARGET_DB_URL" > migration-status-staging-before.txt
      - name: Staging-Migrationen anwenden
        if: github.event_name == 'push' || inputs.operation == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(psql "$TARGET_DB_URL" -Atc "select to_regclass('public.companies')")" ]; then
            echo "Leeres Stagingprojekt erkannt: historisches Basisschema wird initialisiert."
            psql "$TARGET_DB_URL" -v ON_ERROR_STOP=1 -f supabase/schema.sql
          fi
          supabase db push --yes --db-url "$TARGET_DB_URL"
          supabase migration list --db-url "$TARGET_DB_URL" > migration-status-staging-after.txt
      - uses: actions/upload-artifact@v4
        with:
          name: migration-status-staging-${{ github.run_id }}
          path: migration-status-staging-*.txt
          retention-days: 90

  production:
    if: inputs.target == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      TARGET_DB_URL: ${{ secrets.PRODUCTION_DB_URL }}

    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Produktions-Migrationsstand prüfen
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TARGET_DB_URL" || { echo "::error::PRODUCTION_DB_URL fehlt"; exit 1; }
          supabase migration list --db-url "$TARGET_DB_URL" > migration-status-production-before.txt
      - name: Produktionsfreigabe prüfen
        if: inputs.operation == 'apply'
        shell: bash
        env:
          CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
        run: |
          set -euo pipefail
          test "$CONFIRM_PRODUCTION" = "DEPLOY-PRODUCTION" || {
            echo "::error::Für das Anwenden auf Produktion fehlt DEPLOY-PRODUCTION"
            exit 1
          }
      - name: Historischen Produktionsstand einmalig abgleichen
        if: inputs.operation == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(psql "$TARGET_DB_URL" -Atc "select 1 from supabase_migrations.schema_migrations where version = '20260613142431'")" ]; then
            psql "$TARGET_DB_URL" -v ON_ERROR_STOP=1 -At -F '|' \
              -f supabase/check_migrationen.sql > production-core-check.txt
            cat production-core-check.txt

            unexpected_missing="$(
              grep 'FEHLT' production-core-check.txt \
                | grep -v '^20260726183000_complete_maler_catalog|' \
                || true
            )"
            if [ -n "$unexpected_missing" ]; then
              echo "::error::Der produktive Schema-Stand passt nicht vollständig zu den historischen Migrationen."
              printf '%s\n' "$unexpected_missing"
              exit 1
            fi

            supabase migration repair \
              20260613142431 20260613142432 20260613144614 \
              20260613150138 20260613191600 20260613213937 \
              20260614054925 20260614060425 20260614132752 \
              20260614182218 20260614192523 20260614192524 \
              20260614192525 20260615065725 20260615070303 \
              20260615193423 20260615193424 20260617063703 \
              20260623195834 20260701173855 20260701173856 \
              20260702092924 20260704074603 20260704203908 \
              20260705064529 20260712120000 20260714120000 \
              20260717120000 20260717140000 20260717160000 \
              20260720183000 20260720204500 20260720211000 \
              --status applied --db-url "$TARGET_DB_URL"
          fi
      - name: Produktions-Migrationen anwenden
        if: inputs.operation == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --yes --db-url "$TARGET_DB_URL"
          supabase migration list --db-url "$TARGET_DB_URL" > migration-status-production-after.txt
      - uses: actions/upload-artifact@v4
        with:
          name: migration-status-production-${{ github.run_id }}
          path: migration-status-production-*.txt
          retention-days: 365
