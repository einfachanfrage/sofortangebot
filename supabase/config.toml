[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[edge_runtime]
policy = "per_worker"
inspector_port = 8083

[functions.transcribe]
verify_jwt = true

[functions.ki-extrahieren]
verify_jwt = true

[functions.ki-matchen]
verify_jwt = true

[functions.ki-pruefen]
verify_jwt = true

[functions.angebot-autosave]
verify_jwt = true

[analytics]
enabled = false
